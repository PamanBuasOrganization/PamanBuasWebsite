<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sky Quiz Shooter</title>
    <style>
      :root{--bg:#0b1020;--fg:#fff;--card:#1b2340;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#fff;--card:#1b2340}}
      :root[data-theme="dark"]{--bg:#0b1020;--fg:#fff;--card:#1b2340}
      html,body{height:100%;margin:0}
      body{background:var(--bg);color:var(--fg);font-family:'Trebuchet MS',Verdana,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}
      #wrap{position:relative;height:min(100vh,calc(100vw*1.5));aspect-ratio:2/3;max-height:100%}
      canvas{width:100%;height:100%;display:block;border-radius:10px;touch-action:none;background:#1c6fb5}
      #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;background:rgba(10,14,40,.82);border-radius:10px;overflow:auto;font-size:clamp(12px,3.2vmin,17px)}
      h1{margin:0 0 6px;font-size:2.2em;letter-spacing:1px;text-shadow:0 3px 0 #6a1b9a}
      h2{margin:0 0 12px}
      p{margin:6px 0;opacity:.9}
      .btn{border:0;border-radius:12px;padding:.8em 1.6em;font:inherit;font-weight:700;color:#fff;background:#8e24aa;box-shadow:0 5px 0 #4a148c;cursor:pointer;margin-top:12px}
      .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4a148c}
      .q{background:#fff;color:#222;border-radius:14px;padding:14px 16px;font-weight:700;font-size:1.2em;width:100%;box-shadow:0 5px 0 #0003;margin-bottom:12px}
      .cat{font-size:.7em;color:#8e24aa;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
      .ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
      .a{border:0;border-radius:12px;padding:1em .6em;color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 5px 0 #0004;min-height:4em}
      .a:nth-child(1){background:#e53935}.a:nth-child(2){background:#1e88e5}.a:nth-child(3){background:#fb8c00}.a:nth-child(4){background:#43a047}
      .a.right{outline:4px solid #fff;filter:brightness(1.2)}.a.wrong{opacity:.35}
      .up{display:flex;gap:10px;width:100%}
      .card{flex:1;background:var(--card);border:3px solid #8e24aa;border-radius:14px;padding:12px 6px;cursor:pointer;color:inherit;font:inherit}
      .card:hover{background:#2a3460;transform:translateY(-3px)}
      .card b{display:block;font-size:1.1em;margin:6px 0}.card span{font-size:2em}.card small{opacity:.8}
      .msg{font-size:1.5em;font-weight:800;margin:6px 0}
    </style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="480" height="720"></canvas><div id="ov"></div></div>
  <script>
    /* ============ QUESTIONS — edit freely: {cat, q, a:[4 options], c:index of correct} ============ */
    const QUESTIONS=[ {cat:'Math',q:'What is 12 × 12?',
    a:['124','144','132','148'],c:1},
    {cat:'Math',q:'What is the derivative of x²?',a:['x','2x','x²','2'],c:1},
    {cat:'Math',q:'What is the value of π to 2 decimals?',a:['3.12','3.14','3.16','3.41'],c:1},
    {cat:'Math',q:'What is the square root of 169?',a:['11','12','13','14'],c:2},
    {cat:'Physics',q:'What is the SI unit of force?',a:['Joule','Watt','Pascal','Newton'],c:3},
    {cat:'Physics',q:'Approximate speed of light in vacuum?',a:['3×10⁸ m/s','3×10⁶ m/s','3×10⁵ m/s','3×10¹⁰ m/s'],c:0},
    {cat:'Physics',q:'Which law states F = ma?',a:['Newton’s 1st','Newton’s 2nd','Newton’s 3rd','Ohm’s law'],c:1},
    {cat:'Physics',q:'Acceleration due to gravity on Earth?',a:['4.9 m/s²','9.8 m/s²','12.5 m/s²','1.6 m/s²'],c:1},
    {cat:'Computer Science',q:'What does CPU stand for?',a:['Central Process Unit','Central Processing Unit','Computer Primary Unit','Core Power Unit'],c:1},
    {cat:'Computer Science',q:'How many bits are in a byte?',a:['4','8','16','32'],c:1},
    {cat:'Computer Science',q:'Which structure is LIFO?',a:['Queue','Stack','Array','Heap'],c:1},
    {cat:'Computer Science',q:'Binary search time complexity?',a:['O(n)','O(n²)','O(log n)','O(1)'],c:2},
    {cat:'Computer Science',q:'Binary 1010 equals what in decimal?',a:['8','10','12','14'],c:1}
    ];
    /* ============ SETUP ============ */
    const W=480,H=720,cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
    const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    let state='START_SCREEN', score=0, best=0, charge=0, time=0, spawnT=0, shake=0, lastQ=-1;
    let bullets=[],enemies=[],particles=[],orbs=[],player;
    const keys={}; let tgt=null;

    /* ============ CLASSES ============ */
    /** Particle: short-lived spark used for explosions and engine trails */
    class Particle{
      constructor(x,y,color,speed=160,life=.6,size=3){const a=rnd(0,6.28),s=rnd(.2,1)*speed;this.x=x;this.y=y;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.life=this.max=life*rnd(.6,1.2);this.color=color;this.size=size}
      update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=dt;return this.life>0}

      draw(){ctx.globalAlpha=clamp(this.life/this.max,0,1);ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size*ctx.globalAlpha+.5,0,6.3);ctx.fill();ctx.globalAlpha=1}
    }
    const boom=(x,y,c,n=18,sp=200)=>{for(let i=0;i<n;i++)particles.push(new Particle(x,y,i%3?c:'#fff6b0',sp,.7,4))};

    /** Bullet: friendly or hostile projectile. Removed when off-screen (no leaks). */
    class Bullet{

      constructor(x,y,vx,vy,o={}){Object.assign(this,{x,y,vx,vy,r:4,dmg:1,friendly:true,pierce:false,color:'#ffe066',laser:false},o);this.hit=new Set()}
      update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;return this.x>-30&&this.x<W+30&&this.y>-40&&this.y<H+40}
      draw(){

        if(this.laser){ctx.fillStyle='#8ff';ctx.shadowColor='#0ff';ctx.shadowBlur=10;ctx.fillRect(this.x-2.5,this.y-14,5,28);ctx.shadowBlur=0;return}
        const g=ctx.createRadialGradient(this.x,this.y,1,this.x,this.y,this.r+4);

        g.addColorStop(0,'#fff');g.addColorStop(.5,this.color);g.addColorStop(1,'transparent');

        ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,this.r+4,0,6.3);ctx.fill();
      }
    }

    /** Enemy: three archetypes defined in ENEMY_TYPES */
    const ENEMY_TYPES={
      scout:{hp:1,r:14,score:100,fire:.9,color:'#ff7043',orbs:1},
      interceptor:{hp:6,r:18,score:250,fire:1.8,color:'#ab47bc',orbs:2.1},
      bomber:{hp:22,r:30,score:600,fire:2.4,color:'#78909c',orbs:3.5}
    };
    class Enemy{
      constructor(type,x,diff){const t=ENEMY_TYPES[type];Object.assign(this,t);this.type=type;this.x=this.bx=x;
      this.y=-40;this.hp=this.max=Math.ceil(t.hp*(1+diff*.12));this.t=rnd(0,6);this.ft=rnd(.3,t.fire);this.flash=0;this.diff=diff}
      update(dt){
        this.t+=dt;this.flash-=dt;this.ft-=dt;

        if(this.type==='scout'){this.y+=170*dt;this.x=this.bx+Math.sin(this.t*3)*70}
        else if(this.type==='interceptor'){this.y+=100*dt;this.x+=Math.sign(player.x-this.x)*45*dt}
        else this.y+=45*dt;

        if(this.ft<=0&&this.y>0&&this.y<H-120){this.ft=this.fire/(1+this.diff*.05);this.shoot()}
        this.x=clamp(this.x,this.r,W-this.r);
        return this.y<H+60&&this.hp>0;
      }
      shoot(){
        const o={friendly:false,color:'#ff5252'};
        if(this.type==='scout')bullets.push(new Bullet(this.x,this.y+10,0,300,{...o,r:3}));
        else if(this.type==='interceptor'){const a=Math.atan2(player.y-this.y,player.x-this.x);bullets.push(newBullet(this.x,this.y+10,Math.cos(a)*230,Math.sin(a)*230,{...o,r:4,color:'#ff80ab'}))}
        else for(const a of[-.4,0,.4])bullets.push(new Bullet(this.x,this.y+20,Math.sin(a)*160,Math.cos(a)*160,{...o,r:8,color:'#e040fb'}));
      }
      draw(){
        ctx.save();ctx.translate(this.x,this.y);ctx.rotate(Math.PI);

        ctx.fillStyle=this.flash>0?'#fff':this.color;ctx.strokeStyle='#0006';ctx.lineWidth=2;
        ctx.beginPath();

        if(this.type==='scout'){ctx.moveTo(0,-16);ctx.lineTo(16,12);ctx.lineTo(0,6);ctx.lineTo(-16,12)}
        else if(this.type==='interceptor'){ctx.moveTo(0,-20);ctx.lineTo(7,-4);ctx.lineTo(24,8);ctx.lineTo(24,14);ctx.lineTo(6,8);ctx.lineTo(0,18);ctx.lineTo(-6,8);ctx.lineTo(-24,14);ctx.lineTo(-24,8);ctx.lineTo(-7,-4)}

        else{ctx.moveTo(0,-30);ctx.lineTo(10,-14);ctx.lineTo(40,0);ctx.lineTo(40,10);ctx.lineTo(12,8);ctx.lineTo(10,26);ctx.lineTo(18,32);ctx.lineTo(-18,32);ctx.lineTo(-10,26);ctx.lineTo(-12,8);ctx.lineTo(-40,10);ctx.lineTo(-40,0);ctx.lineTo(-10,-14)}
        ctx.closePath();ctx.fill();ctx.stroke();

        ctx.fillStyle='#263238';ctx.beginPath();ctx.ellipse(0,-4,4,7,0,0,6.3);ctx.fill();
        ctx.restore();

        if(this.hp<this.max){ctx.fillStyle='#0008';ctx.fillRect(this.x-18,this.y-this.r-10,36,4);ctx.fillStyle='#f44';ctx.fillRect(this.x-18,this.y-this.r-10,36*this.hp/this.max,4)}
      }
    }

    /** Player: handles movement, auto-fire, upgrades and drawing */
    class Player{

      constructor(){Object.assign(this,{x:W/2,y:H-100,r:12,hp:100,maxHp:100,shots:1,rate:1,pierce:false,drones:0,shield:0,fireT:0,inv:0,level:1,t:0})}
      update(dt){
        this.t+=dt;this.inv-=dt;const sp=300;let dx=0,dy=0;
        if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;/* Keyboard movement */
        if(dx||dy){tgt=null;
          const l=Math.hypot(dx,dy);this.x+=dx/l*sp*dt;this.y+=dy/l*sp*dt}
        else if(tgt){const k=1-Math.pow(.0005,dt);
          this.x+=(tgt.x-this.x)*k;
          this.y+=(tgt.y-this.y)*k
        }
        this.x=clamp(this.x,16,W-16);
        this.y=clamp(this.y,40,H-30);
        this.fireT-=dt;if(this.fireT<=0){
          this.fireT=.28/this.rate;this.fire()
        }
        if(Math.random()<.6)particles.push(Object.assign(new Particle(this.x,this.y+16,'#ffb74d',40,.25,2),{vy:rnd(80,140),vx:rnd(-15,15)}));
      }
      fire(){
        const n=this.shots,o=this.pierce?{pierce:true,laser:true,dmg:1.5,r:3}:{};
        for(let i=0;i<n;i++){const a=n===1?0:(i-(n-1)/2)*.14;bullets.push(new Bullet(this.x+Math.sin(a)*8,this.y-16,Math.sin(a)*520,-Math.cos(a)*520,o))}
        for(let i=0;i<this.drones;i++){const d=this.dronePos(i);bullets.push(new Bullet(d.x,d.y-6,0,-500,{r:3,color:'#9ff'}))}
      }
      dronePos(i){const a=this.t*2.2+i*6.283/this.drones;return{x:this.x+Math.cos(a)*44,y:this.y+Math.sin(a)*18}}
      hurt(d){
        if(this.inv>0)return;this.inv=.8;shake=8;
        if(this.shield>0){this.shield--;boom(this.x,this.y,'#4fc3f7',10);return}
        this.hp-=d;boom(this.x,this.y,'#ff8a65',12);

        if(this.hp<=0){this.hp=0;boom(this.x,this.y,'#ffa726',50,320);gameOver()}
      }
      draw(){ /* Draw player ship and drones */
        if(this.inv>0&&Math.floor(this.inv*20)%2)return;
        for(let i=0;i<this.drones;i++){const d=this.dronePos(i);ctx.fillStyle='#80deea';ctx.beginPath();ctx.arc(d.x,d.y,6,0,6.3);ctx.fill();ctx.strokeStyle='#006064';ctx.stroke()}
        ctx.save();ctx.translate(this.x,this.y);

        ctx.fillStyle='#37474f';ctx.beginPath();ctx.moveTo(-6,14);ctx.lineTo(-14,22);ctx.lineTo(14,22);ctx.lineTo(6,14);ctx.fill();
        const g=ctx.createLinearGradient(-28,0,28,0);g.addColorStop(0,'#1e88e5');g.addColorStop(.5,'#90caf9');g.addColorStop(1,'#1e88e5');
        ctx.fillStyle=g;ctx.strokeStyle='#0d47a1';ctx.lineWidth=2;

        ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(5,-8);ctx.lineTo(28,6);ctx.lineTo(28,12);ctx.lineTo(6,8);ctx.lineTo(4,18);ctx.lineTo(12,22);ctx.lineTo(-12,22);ctx.lineTo(-4,18);ctx.lineTo(-6,8);ctx.lineTo(-28,12);ctx.lineTo(-28,6);ctx.lineTo(-5,-8);ctx.closePath();ctx.fill();ctx.stroke();

        ctx.fillStyle='#e3f2fd';ctx.beginPath();ctx.ellipse(0,-6,3.5,8,0,0,6.3);ctx.fill();
        ctx.fillStyle='#ef5350';ctx.fillRect(-28,6,5,3);ctx.fillRect(23,6,5,3);
        ctx.restore();

        if(this.shield>0){ctx.strokeStyle='rgba(79,195,247,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,this.y,26,0,6.3);ctx.stroke()}
      }
    }

    /* ============ BACKGROUND ============ */
    const clouds=Array.from({length:9},(_,i)=>({x:rnd(0,W),y:rnd(0,H),s:.4+(i%3)*.5,w:rnd(50,110)}));
    const islands=[{x:90,y:100,r:40},{x:380,y:420,r:55}];
    function drawBg(dt){
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d5ea8');g.addColorStop(1,'#29a3d8');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=2;
      const off=(time*40)%60;for(let y=-60+off;y<H;y+=60){ctx.beginPath();for(letx=0;x<=W;x+=20)ctx.lineTo(x,y+Math.sin(x*.04+y)*4);ctx.stroke()}
      for(const i of islands){i.y+=60*dt;if(i.y>H+80){i.y=-80;i.x=rnd(50,W-50)}

      ctx.fillStyle='#e6d08a';ctx.beginPath();ctx.ellipse(i.x,i.y,i.r,i.r*.6,0,0,6.3);ctx.fill();

      ctx.fillStyle='#3d9a4a';ctx.beginPath();ctx.ellipse(i.x,i.y,i.r*.7,i.r*.4,0,0,6.3);ctx.fill()}
      for(const c of clouds){c.y+=c.s*90*dt;if(c.y>H+40){c.y=-40;c.x=rnd(0,W)}
      ctx.fillStyle=`rgba(255,255,255,${.25+c.s*.25})`;
      for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(c.x+(k-1)*c.w*.3,c.y+(k===1?-6:0),c.w*.3,c.w*.16,0,0,6.3);ctx.fill()}}
    }

    /* ============ UPGRADES ============ */
    const UPGRADES=[ {icon:'🔱',name:'Twin / Spread Shot',desc:'+1 bullet pervolley',ok:p=>p.shots<5,fn:p=>p.shots++},{icon:'⚡',name:'+25% Fire Rate',desc:'Shootfaster',ok:p=>p.rate<3,fn:p=>p.rate*=1.25},{icon:'🛡️',name:'Shield + Repair',desc:'+30 HP and a shieldcharge',ok:()=>true,fn:p=>{p.hp=Math.min(p.maxHp,p.hp+30);p.shield++}},{icon:'🔦',name:'Piercing Lasers',desc:'Bullets pass throughenemies',ok:p=>!p.pierce,fn:p=>p.pierce=true},{icon:'🛸',name:'Wingman Drone',desc:'An orbiting helper thatshoots',ok:p=>p.drones<3,fn:p=>p.drones++}
    ];

    /* ============ STATES / UI ============ */
    const show=h=>{ov.innerHTML=h;ov.style.display='flex'}, hide=()=>{ov.style.display='none';ov.innerHTML=''};
    function startScreen(){state='START_SCREEN';show(`<h1>SKY QUIZ<br>SHOOTER</h1><p>Shoot enemies, collect glowing orbs, then answer aquiz to power up!</p><p><b>Move:</b> Arrows / WASD / mouse / touchdrag<br><b>Fire:</b> automatic</p><button class="btn" id="go">Take Off✈️</button>`);document.getElementById('go').onclick=newGame}
    function newGame(){bullets=[];enemies=[];particles=[];orbs=[];player=new Player();score=0;charge=0;time=0;spawnT=1;tgt=null;hide();state='PLAYING'}
    function gameOver(){state='GAME_OVER';best=Math.max(best,score);
    setTimeout(()=>{show(`<h1>GAME OVER</h1><div class="msg">Score: ${score}</div><p>Best: ${best}</p><button class="btn" id="again">PlayAgain</button>`);document.getElementById('again').onclick=newGame},900)}
    function openQuiz(){
      state='QUIZ_MODAL';let qi;do{qi=Math.floor(Math.random()*QUESTIONS.length)}while(qi===lastQ&&QUESTIONS.length>1);lastQ=qi;
      const Q=QUESTIONS[qi],opts=Q.a.map((t,i)=>({t,ok:i===Q.c})).sort(()=>Math.random()-.5);
      show(`<div class="q"><div class="cat">⚡ ${Q.cat} Upgrade Quiz</div>${Q.q}</div><div class="ans">${opts.map((o,i)=>`<buttonclass="a" data-i="${i}">${o.t}</button>`).join('')}</div><p id="fb"class="msg"></p>`);
      const btns=[...ov.querySelectorAll('.a')];
      btns.forEach(b=>b.onclick=()=>{
        const o=opts[b.dataset.i];btns.forEach((x,i)=>{x.disabled=true;x.classList.add(opts[i].ok?'right':'wrong')});
        const fb=document.getElementById('fb');
        if(o.ok){fb.textContent='🎉 Correct! Choose an upgrade!';setTimeout(openUpgrades,1100)}
        else{fb.textContent='❌ Not quite — the right answer is highlighted.';setTimeout(resume,2000)}
      });
    }
    function openUpgrades(){
      state='UPGRADE_SELECT';const pool=UPGRADES.filter(u=>u.ok(player)).sort(()=>Math.random()-.5).slice(0,3);
      if(!pool.length)return resume();
      show(`<h2>🎉 Pick your upgrade!</h2><div class="up">${pool.map((u,i)=>`<button class="card"data-i="${i}"><span>${u.icon}</span><b>${u.name}</b><small>${u.desc}</small></button>`).join('')}</div>`);

      ov.querySelectorAll('.card').forEach(c=>c.onclick=()=>{pool[c.dataset.i].fn(player);player.level++;resume()});
    }
    function resume(){charge=0;hide();state='PLAYING'}

    /* ============ INPUT ============ */
    addEventListener('keydown',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});
    addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
    let pressed=false;
    function setTgt(e){const r=cv.getBoundingClientRect();tgt={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H-(e.pointerType==='mouse'?0:50)}}
    cv.addEventListener('pointerdown',e=>{pressed=true;setTgt(e)});
    cv.addEventListener('pointermove',e=>{if(pressed||e.pointerType==='mouse')setTgt(e)});
    addEventListener('pointerup',()=>pressed=false);

    /* ============ GAME LOOP ============ */
    function spawn(dt){
      const diff=time/20;spawnT-=dt;
      if(spawnT>0)return;spawnT=Math.max(.45,1.5-diff*.07);
      const r=Math.random(),bomberP=Math.min(.22,.02+diff*.02),intP=Math.min(.4,.15+diff*.04);
      const type=r<bomberP?'bomber':r<bomberP+intP?'interceptor':'scout';
      const n=type==='scout'&&diff>3&&Math.random()<.4?3:1;
      for(let i=0;i<n;i++)enemies.push(new Enemy(type,rnd(60,W-60)+i*30,diff));
    }
    const dist2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
    function update(dt){
      time+=dt;spawn(dt);player.update(dt);
      bullets=bullets.filter(b=>b.update(dt));
      enemies=enemies.filter(e=>{const alive=e.update(dt);if(!alive&&e.hp<=0)killEnemy(e);return alive&&e.hp>0});
      particles=particles.filter(p=>p.update(dt));
      for(const b of bullets){
        if(b.friendly){
          for(const e of enemies){
            if(e.hp<=0||b.hit.has(e)||dist2(b,e)>(e.r+b.r)**2)continue;
            e.hp-=b.dmg;e.flash=.06;b.hit.add(e);boom(b.x,b.y,'#ffe082',3,80);
            if(!b.pierce){b.dead=true;break}
          }
        }else if(dist2(b,player)<(b.r+player.r)**2){b.dead=true;player.hurt(b.r>6?20:10)}
      }
      bullets=bullets.filter(b=>!b.dead);
      for(const e of enemies)if(e.hp>0&&dist2(e,player)<(e.r+player.r)**2){player.hurt(20);e.hp-=3;e.flash=.1}
      for(const o of orbs){
        o.y+=70*dt;const d=Math.sqrt(dist2(o,player));
        if(d<110){o.x+=(player.x-o.x)/d*260*dt;o.y+=(player.y-o.y)/d*260*dt}
        if(d<22){o.dead=true;charge=Math.min(100,charge+12);score+=10}
        if(o.y>H+20)o.dead=true;
      }
      orbs=orbs.filter(o=>!o.dead);
      if(state==='PLAYING'&&charge>=100)openQuiz();
    }
    function killEnemy(e){

      score+=e.score;charge=Math.min(100,charge+4);boom(e.x,e.y,e.color,e.type==='bomber'?40:20,e.type==='bomber'?300:220);shake=e.type==='bomber'?10:3;
      let n=Math.floor(e.orbs)+(Math.random()<e.orbs%1?1:0);
      while(n--)orbs.push({x:e.x+rnd(-12,12),y:e.y+rnd(-12,12),dead:false});
    }
    function hud(){
      ctx.fillStyle='rgba(8,14,40,.6)';ctx.fillRect(0,0,W,50);
      ctx.fillStyle='#fff';ctx.font='bold 16px Trebuchet MS,Verdana,sans-serif';ctx.textBaseline='top';
      ctx.textAlign='left';ctx.fillText('SCORE '+score,10,7);
      ctx.textAlign='right';ctx.fillText('WEAPON LV '+player.level,W-10,7);
      ctx.textAlign='left';ctx.font='bold 11px Trebuchet MS,Verdana,sans-serif';
      const bar=(x,y,w,v,col,label)=>{ctx.fillStyle='#0008';ctx.fillRect(x,y,w,12);ctx.fillStyle=col;ctx.fillRect(x,y,w*clamp(v,0,1),12);ctx.strokeStyle='#fff8';ctx.strokeRect(x,y,w,12);ctx.fillStyle='#fff';ctx.fillText(label,x+4,y+1)};
      bar(10,30,200,player.hp/player.maxHp,'#e53935','HP '+Math.ceil(player.hp)+(player.shield?'  🛡'+player.shield:''));
      bar(W-210,30,200,charge/100,'#ab47bc','UPGRADE CHARGE');
    }
    function draw(){

      ctx.save();if(shake>0){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
      shake*=.85;if(shake<.3)shake=0}
      for(const o of orbs){const g=ctx.createRadialGradient(o.x,o.y,1,o.x,o.y,12);g.addColorStop(0,'#fff');
      g.addColorStop(.4,'#69f0ae');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,12,0,6.3);ctx.fill()}
      enemies.forEach(e=>e.draw());
      if(player.hp>0)player.draw();
      bullets.forEach(b=>b.draw());
      particles.forEach(p=>p.draw());
      ctx.restore();hud();
    }
    let last=performance.now();
    function loop(now){
      const dt=Math.min(.05,(now-last)/1000);last=now;
      drawBg(state==='PLAYING'||state==='GAME_OVER'?dt:0);
      if(player){if(state==='PLAYING')update(dt);else if(state==='GAME_OVER'){particles=particles.filter(p=>p.update(dt))}draw()}
      requestAnimationFrame(loop);
    }
    startScreen();requestAnimationFrame(loop);
  </script>
</body>
</html>
