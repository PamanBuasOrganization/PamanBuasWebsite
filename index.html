<!DOCTYPE html>

                <li><a href="#LearnMore">Learn More</a></li>
            </ul>

        <!-- footer-->

     <!-- accessibility widget -->
     <aside class ="acc-widget" aria-label="Accessibility Options">

        <!-- hidden checkbox-->
        <input type="checkbox" id="acc-toggle" class ="acc-hidden">
        <label for="acc-toggle" class="acc-trigger">Accessibility</label>

        <!-- widget panel -->
        <div class="acc-panel">

            <!-- option 1-->
            <label class="acc-option">
                <input type="checkbox" id="opt-1">
                <span>option 1</span>
            </label>
            
            <!-- option 2-->
            <label class="acc-option">
                <input type="checkbox" id="opt-2">
                <span>option 2</span>
            </label>
            
            <!-- option 3-->
            <label class="acc-option">
                <input type="checkbox" id="opt-3">
                <span>option 3</span>
            </label>
        </div>
    </aside>
